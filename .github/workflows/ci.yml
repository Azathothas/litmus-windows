name: Build and test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both build paths, each checked against a real WebDAV server.
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autotools
            static: '0'
          - name: makefile-w32
            static: '0'
          - name: makefile-w32-static
            static: '1'
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # path-type: inherit keeps the Windows PATH, so the Python that
          # tests/wsgidav.sh needs stays reachable from the MSYS2 shell.
          path-type: inherit
          install: >-
            autoconf
            automake
            libtool
            m4
            make
            pkgconf
          pacboy: >-
            gcc:p
            openssl:p
            expat:p
            pkgconf:p

      - name: Build (autotools)
        if: matrix.name == 'autotools'
        run: |
          ./autogen.sh
          ./configure --with-ssl=openssl
          make

      - name: Build (Makefile.w32)
        if: matrix.name != 'autotools'
        run: make -f Makefile.w32 STATIC=${{ matrix.static }}

      - name: Check the suites against wsgidav
        run: ./tests/wsgidav.sh --check
        env:
          TEST_COLOUR: '1'
          TEST_NODEBUG: '1'

      - name: Confirm the static binaries carry no third-party DLLs
        if: matrix.static == '1'
        run: |
          set -e
          for exe in *.exe; do
            if objdump -p "$exe" | grep -i "DLL Name" \
               | grep -viE "api-ms-win|kernel32|ws2_32|advapi32|user32|crypt32|bcrypt"; then
              echo "$exe depends on a DLL that will not be present on a clean machine"
              exit 1
            fi
          done
          echo "all executables are self-contained"

      - name: Upload the executables
        if: matrix.static == '1'
        uses: actions/upload-artifact@v4
        with:
          name: litmus-windows-x86_64
          # Just the executables and the documentation.  The "litmus"
          # driver script is generated by configure, which this build
          # path does not run, and it needs a POSIX shell anyway.
          path: |
            *.exe
            README.md
            AGENTS.md
            COPYING
          if-no-files-found: error

  # Tagged pushes publish the self-contained executables as a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: litmus-windows-x86_64
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -r ../litmus-windows-x86_64.zip .
          cd ..
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            litmus-windows-x86_64.zip
